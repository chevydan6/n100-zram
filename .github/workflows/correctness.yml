name: Correctness
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  user-space:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y gcc python3 liblz4-1
      - name: Require SIMD host
        run: grep -qw avx2 /proc/cpuinfo
      - run: python3 tools/build.py
      - run: python3 tests/check.py
      - run: python3 tests/guard.py
      - run: python3 tests/interop.py
      - run: python3 tools/prepare-reuse.py && python3 tests/reuse.py
      - run: python3 tools/prepare-small-table.py && python3 tests/small-table.py
      - name: Check benchmark validation modes
        run: |
          gcc -O2 -Wall -Wextra -Werror benchmarks/native.c -ldl -o build/native
          cp build/scalar.so build/avx2-guard.so build/small-table/
          N100_SMALL_TABLE_EXPERIMENT=1 build/native build/small-table --validate-only
      - run: python3 tools/audit-publication.py
      - name: Validate matched adaptive codecs and size harness
        run: |
          python3 tools/prepare-crossover.py
          BUILD_ROOT="$PWD/build/crossover" python3 tests/check.py
          BUILD_ROOT="$PWD/build/crossover" python3 tests/guard.py
          BUILD_ROOT="$PWD/build/crossover" python3 tests/interop.py
          gcc -O2 -Wall -Wextra -Werror benchmarks/crossover.c -ldl -o build/crossover/benchmark
          build/crossover/benchmark build/crossover --validate-only
          N100_CROSSOVER_SIZES=40,48,56,320,384,448,1280,1536,1792 build/crossover/benchmark build/crossover --validate-only
