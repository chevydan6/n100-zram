name: Correctness
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  user-space:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc python3 liblz4-1
      - name: Require SIMD host
        run: grep -qw avx2 /proc/cpuinfo
      - run: python3 tools/build.py
      - run: python3 tests/check.py
      - run: python3 tests/guard.py
      - run: python3 tests/interop.py
      - run: python3 tools/prepare-reuse.py && python3 tests/reuse.py
