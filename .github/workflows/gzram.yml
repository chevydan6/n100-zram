name: GZRAM experimental correctness
on:
  push:
    paths: ['gzram/**', '.github/workflows/gzram.yml']
  pull_request:
    paths: ['gzram/**', '.github/workflows/gzram.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounds-and-format:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 gzram/tools/build.py
      - run: python3 gzram/tests/check.py
      - run: python3 gzram/tests/check.py --library build/gzram/libgzram-fast.so
      - run: python3 gzram/tests/check.py --library build/gzram/libgzram-block.so
      - run: python3 gzram/tests/check.py --library build/gzram/libgzram-period.so
      - run: python3 gzram/tests/check.py --library build/gzram/libgzram-filter.so
      - name: Hybrid formats and cross-policy decoding
        run: |
          python3 gzram/tests/hybrid.py --library build/gzram/libgzram-hybrid-trial.so --other-libraries build/gzram/libgzram-hybrid-sample.so build/gzram/libgzram-hybrid-recurrence.so
          python3 gzram/tests/hybrid.py --library build/gzram/libgzram-hybrid-sample.so
          python3 gzram/tests/hybrid.py --library build/gzram/libgzram-hybrid-recurrence.so
      - name: Guarded trial prefix bounds
        run: |
          python3 gzram/tests/hybrid.py --library build/gzram/libgzram-hybrid-guard16.so
          python3 gzram/tests/hybrid.py --library build/gzram/libgzram-hybrid-guard32.so
      - name: Fused scan and independent decoder modes
        run: |
          python3 gzram/tests/hybrid.py --library build/gzram/libgzram-hybrid-fused.so --other-libraries build/gzram/libgzram-hybrid-guard32.so build/gzram/libgzram-hybrid-guard32mixed.so
          python3 gzram/tests/hybrid.py --library build/gzram/libgzram-hybrid-guard32mixed.so
      - name: Scalar word-at-a-time classifier
        run: python3 gzram/tests/hybrid.py --library build/gzram/libgzram-hybrid-wordguard.so --same-encoding-libraries build/gzram/libgzram-hybrid-guard32.so
      - name: Independent classifier and mixed decoder
        run: python3 gzram/tests/hybrid.py --library build/gzram/libgzram-hybrid-wordmixed.so --same-encoding-libraries build/gzram/libgzram-hybrid-guard32.so build/gzram/libgzram-hybrid-wordguard.so --other-libraries build/gzram/libgzram-hybrid-guard32mixed.so
      - name: Independent vector tail
        run: python3 gzram/tests/hybrid.py --library build/gzram/libgzram-hybrid-splittail.so --same-encoding-libraries build/gzram/libgzram-hybrid-wordmixed.so build/gzram/libgzram-hybrid-guard32.so --other-libraries build/gzram/libgzram-hybrid-guard32mixed.so
      - name: Outlined scanner and sparse bit-scan decoder
        run: |
          for policy in outlinetail ctzunpack wordrepeat ctzrepeat bitpack mixpack ctzfull bitctz bitfull select2 select3 select4; do
            python3 gzram/tests/hybrid.py --library build/gzram/libgzram-hybrid-$policy.so --same-encoding-libraries build/gzram/libgzram-hybrid-wordmixed.so build/gzram/libgzram-hybrid-splittail.so --other-libraries build/gzram/libgzram-hybrid-guard32mixed.so
          done
          python3 gzram/tests/hybrid.py --library build/gzram/libgzram-hybrid-repeatmerge.so --other-libraries build/gzram/libgzram-hybrid-wordmixed.so
          python3 gzram/tests/hybrid.py --library build/gzram/libgzram-hybrid-repeatmergefast.so --same-encoding-libraries build/gzram/libgzram-hybrid-repeatmerge.so --other-libraries build/gzram/libgzram-hybrid-wordmixed.so
          python3 gzram/tests/hybrid.py --library build/gzram/libgzram-hybrid-wordmixed.so --other-libraries build/gzram/libgzram-hybrid-repeatmerge.so
      - name: Address and undefined-behavior sanitizers
        run: |
          EXTRA_CFLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' python3 gzram/tools/build.py --output build/gzram-asan
          export LD_PRELOAD="$(gcc -print-file-name=libasan.so)"
          export ASAN_OPTIONS=detect_leaks=0:abort_on_error=1
          export UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1
          python3 gzram/tests/check.py --library build/gzram-asan/libgzram.so
          python3 gzram/tests/check.py --library build/gzram-asan/libgzram-fast.so
          python3 gzram/tests/check.py --library build/gzram-asan/libgzram-block.so
          python3 gzram/tests/check.py --library build/gzram-asan/libgzram-period.so
          python3 gzram/tests/check.py --library build/gzram-asan/libgzram-filter.so
          python3 gzram/tests/hybrid.py --library build/gzram-asan/libgzram-hybrid-trial.so
          python3 gzram/tests/hybrid.py --library build/gzram-asan/libgzram-hybrid-sample.so
          python3 gzram/tests/hybrid.py --library build/gzram-asan/libgzram-hybrid-recurrence.so
          python3 gzram/tests/hybrid.py --library build/gzram-asan/libgzram-hybrid-guard16.so
          python3 gzram/tests/hybrid.py --library build/gzram-asan/libgzram-hybrid-guard32.so
          python3 gzram/tests/hybrid.py --library build/gzram-asan/libgzram-hybrid-fused.so
          python3 gzram/tests/hybrid.py --library build/gzram-asan/libgzram-hybrid-guard32mixed.so
          python3 gzram/tests/hybrid.py --library build/gzram-asan/libgzram-hybrid-wordguard.so --same-encoding-libraries build/gzram-asan/libgzram-hybrid-guard32.so
          python3 gzram/tests/hybrid.py --library build/gzram-asan/libgzram-hybrid-wordmixed.so --same-encoding-libraries build/gzram-asan/libgzram-hybrid-guard32.so build/gzram-asan/libgzram-hybrid-wordguard.so --other-libraries build/gzram-asan/libgzram-hybrid-guard32mixed.so
          python3 gzram/tests/hybrid.py --library build/gzram-asan/libgzram-hybrid-splittail.so --same-encoding-libraries build/gzram-asan/libgzram-hybrid-wordmixed.so build/gzram-asan/libgzram-hybrid-guard32.so --other-libraries build/gzram-asan/libgzram-hybrid-guard32mixed.so
          for policy in outlinetail ctzunpack wordrepeat ctzrepeat bitpack mixpack ctzfull bitctz bitfull select2 select3 select4; do
            python3 gzram/tests/hybrid.py --library build/gzram-asan/libgzram-hybrid-$policy.so --same-encoding-libraries build/gzram-asan/libgzram-hybrid-wordmixed.so build/gzram-asan/libgzram-hybrid-splittail.so --other-libraries build/gzram-asan/libgzram-hybrid-guard32mixed.so
          done
          python3 gzram/tests/hybrid.py --library build/gzram-asan/libgzram-hybrid-repeatmerge.so --other-libraries build/gzram-asan/libgzram-hybrid-wordmixed.so
          python3 gzram/tests/hybrid.py --library build/gzram-asan/libgzram-hybrid-repeatmergefast.so --same-encoding-libraries build/gzram-asan/libgzram-hybrid-repeatmerge.so --other-libraries build/gzram-asan/libgzram-hybrid-wordmixed.so
          python3 gzram/tests/hybrid.py --library build/gzram-asan/libgzram-hybrid-wordmixed.so --other-libraries build/gzram-asan/libgzram-hybrid-repeatmerge.so
      - name: Analysis schemas and missing measurements
        run: python3 gzram/tests/analysis.py
      - name: Validate native benchmark fixture
        run: |
          gcc -O2 -Wall -Wextra -Werror gzram/bench.c -ldl -o build/gzram/benchmark
          if grep -qw avx2 /proc/cpuinfo; then build/gzram/benchmark build/gzram --validate-only; fi
      - name: Sanitize the complete benchmark registry and shuffle
        run: |
          gcc -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer gzram/bench.c -ldl -o build/gzram-asan/benchmark
          if grep -qw avx2 /proc/cpuinfo; then
            ASAN_OPTIONS=detect_leaks=0:abort_on_error=1 UBSAN_OPTIONS=halt_on_error=1 build/gzram-asan/benchmark build/gzram-asan --validate-only
          fi
